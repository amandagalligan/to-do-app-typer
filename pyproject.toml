[project]
name = "to-do-app-typer"
version = "0.1.0"
description = ""
authors = [
    {name = "amandagalligan",email = "ephemerism@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer (>=0.24.1,<0.25.0)",
    "typing_extensions (>=4.15.0,<5.0.0)",
]

[project.scripts]
rptodo = "rptodo.__main__:main"

[tool.poetry]
packages = [
    { include = "rptodo" }
]

[tool.poetry.group.dev.dependencies]
isort = "^6.0"
flake8 = "^6.0"
black = "^24.3"

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
